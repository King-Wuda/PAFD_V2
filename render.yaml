# Render Blueprint — https://render.com/docs/blueprint-spec
#
# The two NEXT_PUBLIC_ values are marked `sync: false`, so Render asks for them
# on first deploy instead of the repository carrying them. Next inlines them
# into the browser bundle at build time rather than reading them at runtime:
# they must exist before the first build, and changing either one needs a fresh
# deploy before the change reaches anybody.
#
# `plan: starter` is deliberate. A free web service sleeps after fifteen minutes
# idle and takes about a minute to wake, and this is a tool someone opens to
# check one dimension between drawings.

services:
  - type: web
    name: pafd
    runtime: node
    plan: starter
    region: frankfurt          # nearest Render region to South Africa
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health   # cheap liveness probe; `/` would refetch every price
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
